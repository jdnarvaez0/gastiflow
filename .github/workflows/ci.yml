name: CI/CD Pipeline

on:
  push:
    branches: [main]  # Only run full pipeline on main
    paths-ignore:
      - '**.md'
      - 'frontend/.nuxt/**'
      - 'frontend/dist/**'
  pull_request:
    branches: [main, dev]  # Run tests on PRs to both branches

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  # ============== Backend Tests ==============
  test-backend:
    runs-on: ubuntu-latest
    # Run on PRs to any branch, or push to main
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: gastiflow_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio flake8

      - name: Lint with flake8
        working-directory: ./backend
        run: |
          # Stop on syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Treat all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics

      - name: Run tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/gastiflow_test
          JWT_SECRET_KEY: test-secret-key-for-ci-only
          GEMINI_API_KEY: test-api-key
          TELEGRAM_BOT_TOKEN: test-bot-token
          ENVIRONMENT: test
        run: |
          pytest test/test_db.py test/test_telegram_integration.py -v --tb=short

  # ============== Frontend Build ==============
  build-frontend:
    runs-on: ubuntu-latest
    # Run on PRs to any branch, or push to main
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build application
        working-directory: ./frontend
        run: npm run build
        env:
          NUXT_API_URL: http://localhost:8000
          NUXT_TELEGRAM_BOT_USERNAME: gastiflow_bot

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/.output/public
          retention-days: 7

  # ============== Security Scan ==============
  security:
    runs-on: ubuntu-latest
    # Run on PRs to any branch, or push to main
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Bandit (Python security linter)
        uses: PyCQA/bandit@main
        with:
          args: "-r backend/ -f json -o bandit-report.json || true"

      - name: Upload security report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report
          path: bandit-report.json
          retention-days: 30

  # ============== Docker Build ==============
  docker-build:
    runs-on: ubuntu-latest
    # Only run on push to main (not on PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test-backend, build-frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: gastiflow-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============== Deploy (Production) ==============
  deploy-production:
    runs-on: ubuntu-latest
    # Only deploy on push to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test-backend, build-frontend, docker-build]
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          echo "Deploying to production..."
          # Add your deployment script here
          # Example: SSH into server and run deployment
          # ssh user@server "cd /app && git pull && docker-compose up -d"
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}

  # ============== Deploy (Staging) - Manual Only ==============
  # This job is disabled for automatic runs
  # Use 'workflow_dispatch' to deploy to staging manually when needed
  deploy-staging:
    runs-on: ubuntu-latest
    if: false  # Disabled - never runs automatically
    # To enable manual deployment, uncomment below and comment out 'if: false':
    # if: github.event_name == 'workflow_dispatch'
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "Deploying to staging..."
          echo "This job is disabled. To deploy to staging:"
          echo "1. Go to Actions tab in GitHub"
          echo "2. Select 'CI/CD Pipeline'"
          echo "3. Click 'Run workflow'"
          echo "4. Select 'dev' branch and run"
