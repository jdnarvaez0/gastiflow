name: Deploy to Staging

# Manual workflow to deploy to staging environment
# Can deploy either dev or main branch

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============== Verify ==============
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        run: |
          if [ -z "${{ secrets.STAGING_SSH_HOST }}" ]; then
            echo "❌ Secret STAGING_SSH_HOST is not set"
            exit 1
          fi
          if [ -z "${{ secrets.STAGING_SSH_USER }}" ]; then
            echo "❌ Secret STAGING_SSH_USER is not set"
            exit 1
          fi
          if [ -z "${{ secrets.STAGING_SSH_KEY }}" ]; then
            echo "❌ Secret STAGING_SSH_KEY is not set"
            exit 1
          fi
          echo "✅ All required secrets are configured"

  # ============== Test ==============
  test:
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: gastiflow_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/gastiflow_test
          JWT_SECRET_KEY: test-secret-key-for-ci-only
          GEMINI_API_KEY: test-api-key
          TELEGRAM_BOT_TOKEN: test-bot-token
          ENVIRONMENT: test
        run: |
          pytest test/test_db.py test/test_telegram_integration.py -v --tb=short

  # ============== Build Frontend ==============
  build-frontend:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build application
        working-directory: ./frontend
        run: npm run build
        env:
          NUXT_API_URL: https://${{ secrets.STAGING_SSH_HOST }}/api
          NUXT_TELEGRAM_BOT_USERNAME: gastiflow_staging_bot

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-staging
          path: frontend/.output/public
          retention-days: 1

  # ============== Build & Push Docker ==============
  build-docker:
    runs-on: ubuntu-latest
    needs: [test, build-frontend]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=staging-${{ github.event.inputs.branch }}
            type=sha,prefix=staging-${{ github.event.inputs.branch }}-

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}-backend
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============== Deploy to Staging Server ==============
  deploy:
    runs-on: ubuntu-latest
    needs: [verify, test, build-frontend, build-docker]
    environment:
      name: staging
      url: https://${{ secrets.STAGING_SSH_HOST }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist-staging
          path: frontend-dist

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_KEY }}
          log-public-key: false

      - name: Add host to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.STAGING_SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to staging server
        env:
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          DEPLOY_DIR: ${{ secrets.STAGING_DEPLOY_DIR || '/opt/gastiflow-staging' }}
          BRANCH: ${{ github.event.inputs.branch }}
        run: |
          echo "🚀 Deploying $BRANCH to staging..."
          
          ssh $SSH_USER@$SSH_HOST << EOF
            set -e
            
            echo "📦 Pulling latest code from $BRANCH..."
            cd $DEPLOY_DIR
            git fetch origin
            git checkout $BRANCH
            git pull origin $BRANCH
            
            echo "🔧 Updating environment for staging..."
            # Create staging-specific env if needed
            if [ ! -f .env.staging ]; then
              echo "⚠️  Warning: .env.staging not found, using .env"
            else
              cp .env.staging .env
            fi
            
            echo "🐳 Updating containers..."
            docker-compose -f docker-compose.yml -f docker-compose.staging.yml pull
            docker-compose -f docker-compose.yml -f docker-compose.staging.yml up -d
            
            echo "🧹 Cleaning up..."
            docker system prune -f
            
            echo "✅ Staging deployment completed!"
          EOF

      - name: Health check
        env:
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
        run: |
          echo "🏥 Running health check..."
          sleep 10
          
          # Check if services are running
          ssh $SSH_USER@$SSH_HOST "cd ${{ secrets.STAGING_DEPLOY_DIR || '/opt/gastiflow-staging' }} && docker-compose ps"
          
          echo "✅ Staging health check passed!"

      - name: Notify success
        if: success()
        run: |
          echo "🎉 Staging deployment successful!"
          echo "Branch: ${{ github.event.inputs.branch }}"
          echo "Commit: ${{ github.sha }}"
          echo "URL: https://${{ secrets.STAGING_SSH_HOST }}"

      - name: Cleanup SSH
        if: always()
        run: rm -rf ~/.ssh
