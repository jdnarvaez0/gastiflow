name: Deploy to Staging

# Manual workflow to deploy dev branch to staging
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - main

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  # ============== Backend Tests ==============
  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: gastiflow_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/gastiflow_test
          JWT_SECRET_KEY: test-secret-key-for-ci-only
          GEMINI_API_KEY: test-api-key
          TELEGRAM_BOT_TOKEN: test-bot-token
          ENVIRONMENT: test
        run: |
          pytest test/test_db.py test/test_telegram_integration.py -v --tb=short

  # ============== Frontend Build ==============
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build application
        working-directory: ./frontend
        run: npm run build
        env:
          NUXT_API_URL: http://staging.gastiflow.local/api
          NUXT_TELEGRAM_BOT_USERNAME: gastiflow_staging_bot

  # ============== Deploy to Staging ==============
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend]
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Deploy to staging
        run: |
          echo "🚀 Deploying ${{ github.event.inputs.branch }} to staging..."
          echo "This is a placeholder. Add your staging deployment commands here."
          echo ""
          echo "Example commands:"
          echo "  - ssh user@staging-server 'cd /app && git fetch && git checkout ${{ github.event.inputs.branch }} && git pull && docker-compose up -d'"
          echo "  - aws ecs update-service --cluster staging --service gastiflow --force-new-deployment"
          echo "  - kubectl set image deployment/gastiflow app=gastiflow:${{ github.sha }} -n staging"
        env:
          STAGING_DEPLOY_KEY: ${{ secrets.STAGING_DEPLOY_KEY }}

      - name: Notify success
        if: success()
        run: |
          echo "✅ Staging deployment completed successfully!"
          echo "Branch: ${{ github.event.inputs.branch }}"
          echo "Commit: ${{ github.sha }}"
