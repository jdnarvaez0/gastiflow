# ---------------------------------------------------------------------------
# NOTA (2026-10-17): El despliegue automatico a AWS EC2 fue DESHABILITADO.
# La produccion ahora corre en un VPS propio (systemd + nginx + PostgreSQL).
#
# Para actualizar la app en produccion: conectarse por SSH al VPS y ejecutar
# el script de actualizacion (git pull + dependencias + migraciones + restart
# de los servicios systemd gastiflow-api y gastiflow-bot).
#
# Este workflow ya NO despliega a ningun lado; queda solo como recordatorio
# manual (Actions -> Run workflow).
# ---------------------------------------------------------------------------
name: Deploy (informativo - deploy manual en VPS)

on:
  workflow_dispatch:

jobs:
  info:
    runs-on: ubuntu-latest
    steps:
      - name: Recordatorio
        run: |
          echo "El deploy automatico esta deshabilitado."
          echo "Produccion corre en un VPS (no en AWS EC2)."
          echo "Para actualizar: conectarse por SSH al VPS y ejecutar el script de actualizacion del backend."
