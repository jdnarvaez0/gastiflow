# https://taskfile.dev
version: '3'

vars:
  PROJECT_NAME: gastiflow
  BACKEND_DIR: backend
  FRONTEND_DIR: frontend
  PYTHON: '{{.BACKEND_DIR}}\.venv\Scripts\python.exe'
  PIP: '{{.BACKEND_DIR}}\.venv\Scripts\pip.exe'
  UVICORN: '{{.BACKEND_DIR}}\.venv\Scripts\uvicorn.exe'
  PYTEST: '{{.BACKEND_DIR}}\.venv\Scripts\pytest.exe'
  NPM: npm

env:
  PYTHONPATH: "{{.BACKEND_DIR}}"

tasks:
  # ============== Setup ==============
  setup:
    desc: Setup development environment
    cmds:
      - echo "Setting up {{.PROJECT_NAME}}..."
      - task: setup:backend
      - task: setup:frontend
      - echo "✅ Setup complete!"

  setup:backend:
    desc: Setup Python virtual environment
    dir: '{{.BACKEND_DIR}}'
    cmds:
      - |
        if (!(Test-Path .venv)) {
          python -m venv .venv
          echo "Created virtual environment"
        } else {
          echo "Virtual environment already exists"
        }
      - '{{.PIP}} install -r requirements.txt'
      - echo "✅ Backend dependencies installed"
    silent: false

  setup:frontend:
    desc: Setup Node.js dependencies
    dir: '{{.FRONTEND_DIR}}'
    cmds:
      - '{{.NPM}} install'
      - echo "✅ Frontend dependencies installed"

  # ============== Development ==============
  dev:
    desc: Start all development services (parallel)
    deps: [dev:api, dev:bot, dev:frontend]

  dev:api:
    desc: Start FastAPI development server
    dir: '{{.BACKEND_DIR}}'
    cmds:
      - '{{.UVICORN}} web.main:app --reload --port 8000 --log-level info'
    env:
      ENVIRONMENT: development

  dev:bot:
    desc: Start Telegram bot
    dir: '{{.BACKEND_DIR}}'
    cmds:
      - '{{.PYTHON}} run_bot.py'
    env:
      ENVIRONMENT: development

  dev:frontend:
    desc: Start Nuxt development server
    dir: '{{.FRONTEND_DIR}}'
    cmds:
      - '{{.NPM}} run dev'

  # ============== Testing ==============
  test:
    desc: Run all tests
    cmds:
      - task: test:backend
      - task: test:integration

  test:backend:
    desc: Run backend unit tests
    dir: '{{.BACKEND_DIR}}'
    cmds:
      - '{{.PYTEST}} test/ -v --tb=short -x'

  test:integration:
    desc: Run Telegram integration tests
    dir: '{{.BACKEND_DIR}}'
    cmds:
      - '{{.PYTEST}} test/test_telegram_integration.py -v --tb=short'

  test:db:
    desc: Run database tests only
    dir: '{{.BACKEND_DIR}}'
    cmds:
      - '{{.PYTEST}} test/test_db.py -v'

  test:gemini:
    desc: Run Gemini AI tests (requires API key)
    dir: '{{.BACKEND_DIR}}'
    cmds:
      - '{{.PYTEST}} test/test_gemini.py -v'

  # ============== Linting & Quality ==============
  lint:
    desc: Run all linters
    cmds:
      - task: lint:backend

  lint:backend:
    desc: Lint Python code with flake8
    dir: '{{.BACKEND_DIR}}'
    cmds:
      - |
        if (Get-Command flake8 -ErrorAction SilentlyContinue) {
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        } else {
          echo "flake8 not installed, skipping..."
        }

  format:
    desc: Format code
    cmds:
      - |
        if (Get-Command black -ErrorAction SilentlyContinue) {
          black {{.BACKEND_DIR}} --line-length 100
        } else {
          echo "black not installed, skipping..."
        }

  # ============== Database ==============
  db:migrate:
    desc: Run database migrations
    dir: '{{.BACKEND_DIR}}'
    cmds:
      - echo "Running migrations..."
      - '{{.PYTHON}} migrations/run_migration.py'

  db:clean:
    desc: Clean up expired tokens and codes
    dir: '{{.BACKEND_DIR}}'
    cmds:
      - echo "Cleaning up expired data..."
      - |
        {{.PYTHON}} -c "
        from services.database_service import DatabaseService
        from web.config import DATABASE_URL
        db = DatabaseService(DATABASE_URL)
        tokens = db.cleanup_expired_tokens()
        codes = db.cleanup_expired_link_codes()
        print(f'Cleaned {tokens} expired tokens')
        print(f'Cleaned {codes} expired link codes')
        "

  # ============== Docker ==============
  docker:up:
    desc: Start all services with Docker Compose
    cmds:
      - docker-compose -f docker-compose.dev.yml up -d

  docker:down:
    desc: Stop Docker services
    cmds:
      - docker-compose -f docker-compose.dev.yml down

  docker:logs:
    desc: View Docker logs
    cmds:
      - docker-compose -f docker-compose.dev.yml logs -f

  docker:build:
    desc: Build Docker images
    cmds:
      - docker-compose -f docker-compose.dev.yml build

  # ============== Deployment ==============
  deploy:
    desc: Deploy to production (requires setup)
    cmds:
      - |
        if (!(Test-Path .env)) {
          echo "Error: .env file not found"
          exit 1
        }
      - echo "Starting deployment..."
      - .\DEPLOY.md

  # ============== Utilities ==============
  clean:
    desc: Clean temporary files and cache
    cmds:
      - Remove-Item -Recurse -Force -ErrorAction SilentlyContinue {{.BACKEND_DIR}}\__pycache__,{{.BACKEND_DIR}}\*.pyc,{{.BACKEND_DIR}}\.pytest_cache,{{.FRONTEND_DIR}}\.nuxt,{{.FRONTEND_DIR}}\dist,{{.FRONTEND_DIR}}\node_modules,.pytest_cache
      - echo "✅ Clean complete"

  env:check:
    desc: Check environment configuration
    cmds:
      - |
        $required = @(
          "JWT_SECRET_KEY",
          "DATABASE_URL",
          "TELEGRAM_BOT_TOKEN",
          "GEMINI_API_KEY",
          "FRONTEND_URL"
        )
        
        if (!(Test-Path .env)) {
          echo "❌ .env file not found"
          exit 1
        }
        
        $envContent = Get-Content .env -Raw
        $missing = @()
        
        foreach ($var in $required) {
          if ($envContent -notmatch "^$var=.+$") {
            $missing += $var
          }
        }
        
        if ($missing.Count -eq 0) {
          echo "✅ All required environment variables are set"
        } else {
          echo "❌ Missing environment variables:"
          $missing | ForEach-Object { echo "  - $_" }
          exit 1
        }

  env:example:
    desc: Create .env from example
    cmds:
      - |
        if (!(Test-Path .env) -and (Test-Path .env.example)) {
          Copy-Item .env.example .env
          echo "✅ Created .env from .env.example"
          echo "⚠️  Please edit .env with your actual values"
        } else {
          echo ".env already exists or .env.example not found"
        }

  # ============== Help ==============
  default:
    desc: Show available tasks
    cmds:
      - task --list-all

  help:
    desc: Show help information
    cmds:
      - echo "Gastiflow Development Tasks"
      - echo ""
      - echo "Quick Start:"
      - echo "  task setup       - Setup development environment"
      - echo "  task dev         - Start all development servers"
      - echo ""
      - echo "Development:"
      - echo "  task dev:api     - Start FastAPI server"
      - echo "  task dev:bot     - Start Telegram bot"
      - echo "  task dev:frontend- Start Nuxt dev server"
      - echo ""
      - echo "Testing:"
      - echo "  task test        - Run all tests"
      - echo "  task test:backend- Run backend tests"
      - echo "  task test:integration - Run Telegram tests"
      - echo ""
      - echo "Docker:"
      - echo "  task docker:up   - Start with Docker"
      - echo "  task docker:down - Stop Docker services"
      - echo ""
      - echo "Utilities:"
      - echo "  task clean       - Clean cache files"
      - echo "  task env:check   - Verify environment config"
