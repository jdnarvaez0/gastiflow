{% extends "base.html" %}

{% block content %}
<div class="topbar">
    <div class="page-title">Nuevo Movimiento</div>
</div>

<div style="max-width: 600px; margin: 0 auto;">
    <div class="stat-card" style="display: block;">
        <div class="stat-header" style="margin-bottom: var(--spacing-md);">
            <span style="font-size: 1.2rem; font-weight: 600; color: var(--text-color);">Registrar Transacción</span>
        </div>

        <form action="/add" method="post" style="display: flex; flex-direction: column; gap: var(--spacing-md);">
            <div style="display: flex; flex-direction: column; gap: 5px;">
                <label for="amount" style="font-weight: 500; color: var(--secondary-color);">Monto</label>
                <input type="number" step="0.01" id="amount" name="amount" required placeholder="0.00"
                    style="padding: 10px; border: 1px solid #E2E8F0; border-radius: var(--radius-sm); font-size: 1rem;">
            </div>

            <div style="display: flex; flex-direction: column; gap: 5px;">
                <label for="description" style="font-weight: 500; color: var(--secondary-color);">Descripción</label>
                <input type="text" id="description" name="description" required placeholder="Ej: Supermercado"
                    style="padding: 10px; border: 1px solid #E2E8F0; border-radius: var(--radius-sm); font-size: 1rem;">
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--spacing-md);">
                <div style="display: flex; flex-direction: column; gap: 5px;">
                    <label for="category" style="font-weight: 500; color: var(--secondary-color);">Categoría</label>
                    <select id="category" name="category"
                        style="padding: 10px; border: 1px solid #E2E8F0; border-radius: var(--radius-sm); font-size: 1rem; background: white;">
                        <option value="Comida">Comida</option>
                        <option value="Transporte">Transporte</option>
                        <option value="Servicios">Servicios</option>
                        <option value="Ocio">Ocio</option>
                        <option value="Salud">Salud</option>
                        <option value="Otros">Otros</option>
                        <option value="Salario">Salario (Ingreso)</option>
                        <option value="Regalo">Regalo (Ingreso)</option>
                    </select>
                </div>

                <div style="display: flex; flex-direction: column; gap: 5px;">
                    <label for="transaction_type" style="font-weight: 500; color: var(--secondary-color);">Tipo</label>
                    <select id="transaction_type" name="transaction_type"
                        style="padding: 10px; border: 1px solid #E2E8F0; border-radius: var(--radius-sm); font-size: 1rem; background: white;">
                        <option value="expense">Gasto</option>
                        <option value="income">Ingreso</option>
                    </select>
                </div>
            </div>

            <div style="display: flex; flex-direction: column; gap: 5px;">
                <label for="date" style="font-weight: 500; color: var(--secondary-color);">Fecha</label>
                <input type="date" id="date" name="date"
                    style="padding: 10px; border: 1px solid #E2E8F0; border-radius: var(--radius-sm); font-size: 1rem;">
            </div>

            <div style="display: flex; gap: 1rem; margin-top: 1rem;">
                <button type="submit" class="btn-primary" style="flex: 1; justify-content: center;">Guardar</button>
                <a href="/"
                    style="flex: 1; text-align: center; padding: 0.75rem 1.5rem; border-radius: var(--radius-sm); text-decoration: none; color: var(--text-color); background: #E2E8F0; font-weight: 600;">Cancelar</a>
            </div>
        </form>
    </div>
</div>

<script>
    // Set default date to today
    document.getElementById('date').valueAsDate = new Date();
</script>
{% endblock %}
