# Docker Compose override for local development
# This file extends docker-compose.yml with development-specific settings

services:
  # ============== Backend API ==============
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development  # Use development stage if multi-stage
    volumes:
      - ./backend:/app
      - /app/.venv  # Preserve virtual env
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - LOG_LEVEL=debug
    command: uvicorn web.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  # ============== Telegram Bot ==============
  bot:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
      - /app/.venv
    environment:
      - ENVIRONMENT=development
    command: python run_bot.py
    depends_on:
      - db
      - api
    profiles:
      - bot  # Only start with: docker-compose --profile bot up

  # ============== Frontend ==============
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev
    ports:
      - "3000:3000"
    environment:
      - NUXT_API_URL=http://localhost:8000
      - NODE_ENV=development
    depends_on:
      - api

  # ============== PostgreSQL ==============
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: gastiflow
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: gastiflow_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gastiflow -d gastiflow_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============== Redis (for caching) ==============
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ============== pgAdmin (optional) ==============
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gastiflow.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    depends_on:
      - db
    profiles:
      - pgadmin  # Only start with: docker-compose --profile pgadmin up

  # ============== Mailpit (email testing) ==============
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    volumes:
      - mailpit_data:/data
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
    profiles:
      - mail  # Only start with: docker-compose --profile mail up

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
  mailpit_data:

# ============== Networks ==============
networks:
  default:
    name: gastiflow-dev
