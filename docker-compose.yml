version: '3.8'

services:
  db:
    image: postgres:15
    container_name: db_gastiflow
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  bot:
    build: ./backend
    container_name: gastiflow_bot
    command: python run_bot.py
    restart: always
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      - ./backend:/app
    depends_on:
      - db

  api:
    build: ./backend
    container_name: gastiflow_api
    command: uvicorn web.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      - db
      - bot

  frontend:
    build:
      context: ./frontend
      args:
        - NUXT_API_URL=http://api:8000
    container_name: gastiflow_frontend
    ports:
      - "3000:3000"
    environment:
      - NUXT_API_URL=http://api:8000
    depends_on:
      - api

volumes:
  postgres_data:
