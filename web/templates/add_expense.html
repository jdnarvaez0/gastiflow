{% extends "base.html" %}

{% block content %}
<div style="max-width: 600px; margin: 0 auto;">
    <div class="card">
        <div class="card-title">Registrar Nuevo Movimiento</div>

        <form action="/add" method="post">
            <div class="form-group">
                <label for="amount">Monto</label>
                <input type="number" step="0.01" id="amount" name="amount" required placeholder="0.00">
            </div>

            <div class="form-group">
                <label for="description">Descripción</label>
                <input type="text" id="description" name="description" required placeholder="Ej: Supermercado">
            </div>

            <div class="form-group">
                <label for="category">Categoría</label>
                <select id="category" name="category">
                    <option value="Comida">Comida</option>
                    <option value="Transporte">Transporte</option>
                    <option value="Servicios">Servicios</option>
                    <option value="Ocio">Ocio</option>
                    <option value="Salud">Salud</option>
                    <option value="Otros">Otros</option>
                    <option value="Salario">Salario (Ingreso)</option>
                    <option value="Regalo">Regalo (Ingreso)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="transaction_type">Tipo</label>
                <select id="transaction_type" name="transaction_type">
                    <option value="expense">Gasto</option>
                    <option value="income">Ingreso</option>
                </select>
            </div>

            <div class="form-group">
                <label for="date">Fecha</label>
                <input type="date" id="date" name="date">
            </div>

            <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                <button type="submit" style="flex: 1;">Guardar</button>
                <a href="/" class="btn-secondary"
                    style="flex: 1; text-align: center; padding: 0.5rem 1rem; border-radius: 0.375rem; text-decoration: none; display: inline-block;">Cancelar</a>
            </div>
        </form>
    </div>
</div>

<script>
    // Set default date to today
    document.getElementById('date').valueAsDate = new Date();
</script>
{% endblock %}
